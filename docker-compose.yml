services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ranker:ranker@db:5432/ranker
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ranker
      POSTGRES_PASSWORD: ranker
      POSTGRES_DB: ranker
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
